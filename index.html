<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FitPulse - Workout Planner</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #10b981;
      --accent-hover: #059669;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg-color);
      position: relative;
    }

    /* Header */
    header {
      padding: 20px 16px 12px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent-color);
    }

    /* Content Area */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 80px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Cards & Stats */
    .stats-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      text-align: center;
    }

    .stat-item .num {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .stat-item .label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Days Filter */
    .days-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    .day-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 10px 16px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    .day-btn.active {
      background: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    /* Workout List */
    .exercise-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .exercise-info h4 {
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .exercise-info p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .check-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--accent-color);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      transition: 0.2s;
    }

    .exercise-card.completed .check-btn {
      background: var(--accent-color);
      color: #fff;
    }

    .exercise-card.completed .exercise-info h4 {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    /* Form Inputs */
    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent-color);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    /* Navigation Bar */
    nav {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }

    .nav-item {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .nav-item.active {
      color: var(--accent-color);
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>FitPulse 🏋️‍♂️</h1>
      <span id="current-date" style="font-size: 0.8rem; color: var(--text-muted);"></span>
    </header>

    <main>
      <!-- TAB 1: Today's Workouts -->
      <section id="today-tab" class="tab-content active">
        <div class="stats-card">
          <div class="stat-item">
            <div class="num" id="total-count">0</div>
            <div class="label">تمارين اليوم</div>
          </div>
          <div class="stat-item">
            <div class="num" id="done-count">0</div>
            <div class="label">المكتملة</div>
          </div>
        </div>

        <div class="days-scroll" id="days-container"></div>

        <h3 style="margin-bottom: 12px; font-size: 1.1rem;" id="selected-day-title">تمارين اليوم</h3>
        <div id="workout-list"></div>
      </section>

      <!-- TAB 2: Add Exercise -->
      <section id="add-tab" class="tab-content">
        <h2 style="margin-bottom: 16px;">إضافة تمرين جديد</h2>
        <form id="add-form">
          <div class="form-group">
            <label>اسم التمرين</label>
            <input type="text" id="ex-name" placeholder="مثال: Push-ups" required>
          </div>
          <div class="form-group">
            <label>اليوم</label>
            <select id="ex-day">
              <option value="الاثنين">الاثنين</option>
              <option value="الثلاثاء">الثلاثاء</option>
              <option value="الأربعاء">الأربعاء</option>
              <option value="الخميس">الخميس</option>
              <option value="الجمعة">الجمعة</option>
              <option value="السبت">السبت</option>
              <option value="الأحد">الأحد</option>
            </select>
          </div>
          <div class="form-group">
            <label>الجولات (Sets)</label>
            <input type="number" id="ex-sets" value="3" min="1" required>
          </div>
          <div class="form-group">
            <label>التكرارات (Reps)</label>
            <input type="number" id="ex-reps" value="12" min="1" required>
          </div>
          <button type="submit" class="btn-submit">حفظ التمرين</button>
        </form>
      </section>
    </main>

    <nav>
      <button class="nav-item active" onclick="switchTab('today-tab', this)">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/></svg>
        التمارين
      </button>
      <button class="nav-item" onclick="switchTab('add-tab', this)">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        إضافة
      </button>
    </nav>
  </div>

  <script>
    const days = ["الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت", "الأحد"];
    let selectedDay = "الاثنين";
    
    // Default workouts sample
    let workouts = JSON.parse(localStorage.getItem('fitpulse_workouts')) || [
      { id: 1, name: "Push-ups", day: "الاثنين", sets: 4, reps: 15, completed: false },
      { id: 2, name: "Squats", day: "الاثنين", sets: 3, reps: 20, completed: false },
      { id: 3, name: "Pull-ups", day: "الثلاثاء", sets: 3, reps: 8, completed: false }
    ];

    function init() {
      renderDays();
      renderWorkouts();
      updateStats();
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    function renderDays() {
      const container = document.getElementById('days-container');
      container.innerHTML = days.map(day => `
        <button class="day-btn ${day === selectedDay ? 'active' : ''}" onclick="selectDay('${day}')">
          ${day}
        </button>
      `).join('');
    }

    function selectDay(day) {
      selectedDay = day;
      document.getElementById('selected-day-title').innerText = `تمارين يوم ${day}`;
      renderDays();
      renderWorkouts();
      updateStats();
    }

    function renderWorkouts() {
      const list = document.getElementById('workout-list');
      const filtered = workouts.filter(w => w.day === selectedDay);

      if (filtered.length === 0) {
        list.innerHTML = `<p style="text-align:center; color: var(--text-muted); padding: 20px;">لا توجد تمارين مبرمجة لهذا اليوم</p>`;
        return;
      }

      list.innerHTML = filtered.map(w => `
        <div class="exercise-card ${w.completed ? 'completed' : ''}">
          <div class="exercise-info">
            <h4>${w.name}</h4>
            <p>${w.sets} الجولات × ${w.reps} التكرار</p>
          </div>
          <button class="check-btn" onclick="toggleComplete(${w.id})">✓</button>
        </div>
      `).join('');
    }

    function toggleComplete(id) {
      workouts = workouts.map(w => w.id === id ? { ...w, completed: !w.completed } : w);
      saveAndRefresh();
    }

    function updateStats() {
      const dayWorkouts = workouts.filter(w => w.day === selectedDay);
      const completed = dayWorkouts.filter(w => w.completed).length;
      document.getElementById('total-count').innerText = dayWorkouts.length;
      document.getElementById('done-count').innerText = completed;
    }

    function saveAndRefresh() {
      localStorage.setItem('fitpulse_workouts', JSON.stringify(workouts));
      renderWorkouts();
      updateStats();
    }

    document.getElementById('add-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const newEx = {
        id: Date.now(),
        name: document.getElementById('ex-name').value,
        day: document.getElementById('ex-day').value,
        sets: document.getElementById('ex-sets').value,
        reps: document.getElementById('ex-reps').value,
        completed: false
      };
      workouts.push(newEx);
      saveAndRefresh();
      e.target.reset();
      selectDay(newEx.day);
      switchTab('today-tab', document.querySelectorAll('.nav-item')[0]);
    });

    init();
  </script>
</body>
</html>
